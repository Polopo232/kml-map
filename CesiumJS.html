  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>

<div id="tab3" class="tab-content">
  <h2>3D Визуализация KML через CesiumJS</h2>
  <div id="cesiumContainer"></div>
</div>

<script>
  let v;
  function openTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(id)?.classList.add('active');

    if (id === 'tab3' && !v) {
      v = new Cesium.Viewer('cesiumContainer', { animation: false, timeline: false });
      Cesium.KmlDataSource.load('./kooli-koju.kml', { camera: v.scene.camera, canvas: v.scene.canvas })
              .then(ds => { v.dataSources.add(ds); v.zoomTo(ds); });
    }
  }
</script>

</body>
</html>
